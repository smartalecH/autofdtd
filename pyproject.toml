[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "autofdtd"
version = "0.1.0"
description = "Bootstrap repository for an autonomous multi-GPU FDTD engine with Meep/Tidy3D compatibility targets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AutoFDTD Contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
autofdtd-prepare = "autofdtd.cli:prepare_main"
autofdtd-orchestrate = "autofdtd.cli:orchestrate_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
