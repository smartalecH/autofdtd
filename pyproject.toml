[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autofdtd"
version = "0.1.0"
description = "GPU-first FDTD package scaffold aligned to a Tidy3D-inspired Phase 1 feature surface."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7,<3",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
autofdtd-feature-matrix = "autofdtd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autofdtd"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
exclude = ["phase1"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["autofdtd"]
